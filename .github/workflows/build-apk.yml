name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v[0-9]*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Compile Go Gateway Core for Android ARM64
      run: |
        cd core
        CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o agnes-gateway-arm64 .
        mkdir -p ../app/src/main/jniLibs/arm64-v8a
        cp agnes-gateway-arm64 ../app/src/main/jniLibs/arm64-v8a/libgateway.so
        echo "Go Core compilation succeeded!"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "缺少 GitHub Secret: KEYSTORE_BASE64"; exit 1
        fi
        mkdir -p keystore
        echo "$KEYSTORE_BASE64" | base64 -d > keystore/agnes-release.p12

    - name: Build Signed Release APK
      env:
        KEYSTORE_FILE: keystore/agnes-release.p12
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
          echo "缺少签名相关 GitHub Secrets"; exit 1
        fi
        if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
        else
          gradle assembleRelease --stacktrace
        fi

    - name: Rename APK Output
      run: |
        mkdir -p release-apk
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          TAG="$GITHUB_REF_NAME"
        else
          TAG="dev-${GITHUB_SHA::7}"
        fi
        cp app/build/outputs/apk/release/app-release.apk "release-apk/AgnesGateway-${TAG}.apk"
        echo "APK build complete: AgnesGateway-${TAG}.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AgnesGateway-APK
        path: release-apk/*.apk

    - name: Create or Update GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Agnes 手机反代网关 ${{ github.ref_name }}"
        body: |
          ### Agnes 手机反代网关 ${{ github.ref_name }} 🎉

          完整变更说明见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。

          **安装说明**：
          - 下载下方 `AgnesGateway-${{ github.ref_name }}.apk` 直接安装。
          - 使用仓库固定 keystore 签名，可直接覆盖升级；从 v1.0.0（临时 debug 证书）升级需先卸载旧版。
          - 若无法解析上游域名，请确认使用 v1.0.2 及以上版本（内核已内置自建 DNS 解析与公共 DNS 兜底）。
        files: release-apk/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
