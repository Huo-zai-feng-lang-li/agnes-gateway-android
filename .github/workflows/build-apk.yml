name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Compile Go Gateway Core for Android ARM64
      run: |
        cd core
        CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o agnes-gateway-arm64 .
        mkdir -p ../app/src/main/jniLibs/arm64-v8a
        cp agnes-gateway-arm64 ../app/src/main/jniLibs/arm64-v8a/libgateway.so
        echo "Go Core compilation succeeded!"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: |
        if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Rename APK Output
      run: |
        mkdir -p release-apk
        TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}"
        cp app/build/outputs/apk/debug/app-debug.apk "release-apk/AgnesGateway-${TAG}.apk"
        echo "APK build complete: AgnesGateway-${TAG}.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AgnesGateway-APK
        path: release-apk/*.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
        name: "Agnes 手机反代网关 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}"
        body: |
          ### Agnes 手机反代网关发布 🎉

          **更新亮点**：
          - 增加 `android:extractNativeLibs="true"` 与从 APK 自动自解压核心引擎兜底机制，完美解决在小米 HyperOS / MIUI 及高版本 Android 上找不到 libgateway.so 的问题。
          - 极速本地反代：局域网直接调用 `http://<手机IP>:8080/v1`。
          - 多 Key 轮询与 30s 智能退避重试，支持多轮工具调用透传。
          - 前台保活与自愈：Notification + WakeLock，子进程崩溃看门狗自动拉起。
          - 运行中热重载：支持免重启热更新 Key 号池。
        files: release-apk/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
