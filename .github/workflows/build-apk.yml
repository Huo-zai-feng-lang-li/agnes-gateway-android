name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Compile Go Gateway Core for Android ARM64
      run: |
        cd core
        CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o agnes-gateway-arm64 .
        mkdir -p ../app/src/main/jniLibs/arm64-v8a
        cp agnes-gateway-arm64 ../app/src/main/jniLibs/arm64-v8a/libgateway.so
        echo "Go Core compilation succeeded!"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: |
        if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Rename APK Output
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/AgnesGateway-v1.0.0.apk
        echo "APK build complete: AgnesGateway-v1.0.0.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AgnesGateway-v1.0.0-APK
        path: release-apk/AgnesGateway-v1.0.0.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Agnes 手机反代网关 v1.0.0"
        body: |
          ### Agnes 手机反代网关 v1.0.0 🎉

          **核心特性**：
          - **极速反代**：局域网直接调用手机网关 `http://<手机IP>:8080/v1`，消除中转开销。
          - **多 Key 轮询负载均衡**：自动轮询，429 智能敏捷退避（30s），故障自动转移。
          - **前台保活与自愈**：Notification + WakeLock，子进程崩溃看门狗自动拉起。
          - **运行中热重载**：支持免重启热更新 Key 号池。

          **安装说明**：
          直接下载下方的 `AgnesGateway-v1.0.0.apk` 安装到 Android 手机即可！
        files: release-apk/AgnesGateway-v1.0.0.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
