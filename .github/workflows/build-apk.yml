name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Compile Go Gateway Core for Android ARM64
      run: |
        cd core
        CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o agnes-gateway-arm64 .
        mkdir -p ../app/src/main/jniLibs/arm64-v8a
        cp agnes-gateway-arm64 ../app/src/main/jniLibs/arm64-v8a/libgateway.so
        echo "Go Core compilation succeeded!"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: |
        if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Rename APK Output
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/AgnesGateway-v1.0.0.apk
        echo "APK build complete: AgnesGateway-v1.0.0.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AgnesGateway-v1.0.0-APK
        path: release-apk/AgnesGateway-v1.0.0.apk

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release-apk/AgnesGateway-v1.0.0.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
